name: Build

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_macos:
    name: Build for MacOS
    runs-on: macos-15
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - name: Build arm64 gui
      uses: ./.github/actions/prepare
      with:
        id: darwin_arm64_gui
        cmd: make darwin_arm64_gui
        out: out/darwin_arm64_gui/yarr.app
    - name: Build amd64 gui
      uses: ./.github/actions/prepare
      with:
        id: darwin_amd64_gui
        cmd: make darwin_amd64_gui
        out: out/darwin_amd64_gui/yarr.app
    - name: Build arm64 cli
      uses: ./.github/actions/prepare
      with:
        id: darwin_arm64
        cmd: make darwin_arm64
        out: out/darwin_arm64/yarr
    - name: Build amd64 cli
      uses: ./.github/actions/prepare
      with:
        id: darwin_amd64
        cmd: make darwin_amd64
        out: out/darwin_amd64/yarr

  build_windows:
    name: Build for Windows GUI
    runs-on: windows-2022
    env:
      CC: gcc
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - name: Setup MinGW
      shell: pwsh
      run: '"C:\mingw64\bin" >> $env:GITHUB_PATH'
    - name: Build amd64 gui
      uses: ./.github/actions/prepare
      with:
        id: windows_amd64_gui
        cmd: make windows_amd64_gui
        out: out/windows_amd64_gui/yarr.exe

  build_multi_cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux_amd64
          - linux_arm64
          - linux_armv7
          - windows_amd64
          - windows_arm64
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - name: Setup Zig
      uses: mlugg/setup-zig@v1
      with:
        version: 0.14.0
    - name: Build CLI
      uses: ./.github/actions/prepare
      with:
        id: ${{ matrix.target }}
        cmd: make ${{ matrix.target }}
        out: out/${{ matrix.target }}/yarr

  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_macos, build_windows, build_multi_cli]
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4.1.7
      with:
        path: .
    - name: Preparation
      run: |
        set -euxo pipefail
        for tarfile in */*.tar; do
          tar -xvf "$tarfile"
        done
        for dir in out/*; do
          echo "Compressing: $dir"
          (cd "$dir" && zip -r "../yarr_$(basename "$dir").zip" .)
        done
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        fail_on_unmatched_files: true
        files: |
          out/*.zip
